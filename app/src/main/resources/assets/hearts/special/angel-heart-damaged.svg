            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
                <defs>
                    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000000" flood-opacity="0.35"/>
</filter>
<filter id="glowEffect" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="12" result="blur"/>
    <feComposite in="SourceGraphic" in2="blur" operator="over"/>
</filter><radialGradient id="angelPearly" cx="35%" cy="35%" r="65%">
    <stop offset="0%" stop-color="#FFFFFF"/>
    <stop offset="50%" stop-color="#FFF9C4"/>
    <stop offset="100%" stop-color="#FFE082"/>
</radialGradient>
<linearGradient id="wingGrad" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#FFFFFF"/>
    <stop offset="70%" stop-color="#FCE4EC"/>
    <stop offset="100%" stop-color="#F8BBD0"/>
</linearGradient>
                </defs>
                <g id="heart-root">
                    <!-- Angel Wings Left & Right -->
<path d="M 160,220 C 60,120 0,140 0,220 C 0,300 60,340 160,280 Z" fill="url(#wingGrad)" stroke="#F06292" stroke-width="6" filter="url(#dropShadow)"/>
<path d="M 352,220 C 452,120 512,140 512,220 C 512,300 452,340 352,280 Z" fill="url(#wingGrad)" stroke="#F06292" stroke-width="6" filter="url(#dropShadow)"/>
<!-- Central Holy Heart -->
<path d="M 256,440 C 248,432 100,320 60,220 C 24,130 84,64 168,64 C 212,64 242,92 256,116 C 270,92 300,64 344,64 C 428,64 488,130 452,220 C 412,320 264,432 256,440 Z" fill="url(#angelPearly)" filter="url(#dropShadow)"/>
<!-- Divine Golden Halo -->
<ellipse cx="256" cy="50" rx="120" ry="24" fill="none" stroke="#FFD700" stroke-width="12" filter="url(#glowEffect)"/>
<path d="M 160,96 C 120,96 88,130 96,176 C 104,220 148,260 176,260 C 196,260 172,200 164,168 C 156,136 172,112 200,104 C 188,98 174,96 160,96 Z" fill="#FFFFFF" opacity="0.85"/><!-- Damaged State: Cracks & Red Bruise Overlay -->
<path d="M 256,440 C 248,432 100,320 60,220 C 24,130 84,64 168,64 C 212,64 242,92 256,116 C 270,92 300,64 344,64 C 428,64 488,130 452,220 C 412,320 264,432 256,440 Z" fill="#FF0000" opacity="0.2"/>
<path d="M 180,140 L 256,240 L 220,320 M 256,240 L 340,200 L 320,360" fill="none" stroke="#1A1A1A" stroke-width="8" stroke-linecap="round"/>
                </g>
            </svg>